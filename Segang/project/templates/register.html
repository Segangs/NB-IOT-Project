<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PicoTeam - 회원가입</title>
    <link rel="stylesheet" href="/static/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Sweet';
            src: url('/static/fonts/SUITE-Light.woff2') format('woff2');
            font-weight: 300;
            font-display: swap;
        }

        @font-face {
            font-family: 'Sweet';
            src: url('/static/fonts/SUITE-Regular.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: 'Sweet';
            src: url('/static/fonts/SUITE-Medium.woff2') format('woff2');
            font-weight: 500;
            font-display: swap;
        }

        @font-face {
            font-family: 'Sweet';
            src: url('/static/fonts/SUITE-SemiBold.woff2') format('woff2');
            font-weight: 600;
            font-display: swap;
        }

        @font-face {
            font-family: 'Sweet';
            src: url('/static/fonts/SUITE-Bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        @font-face {
            font-family: 'Sweet';
            src: url('/static/fonts/SUITE-ExtraBold.woff2') format('woff2');
            font-weight: 800;
            font-display: swap;
        }

        @font-face {
            font-family: 'Sweet';
            src: url('/static/fonts/SUITE-Heavy.woff2') format('woff2');
            font-weight: 900;
            font-display: swap;
        }

        :root {
            --bg: #0b0f19;
            --surface: rgba(30, 41, 59, 0.7);
            --primary: #2563eb;
            --primary-glow: rgba(37, 99, 235, 0.3);
            --secondary: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --font-family: 'Sweet', sans-serif;
            --font-title: 'Sweet', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Ambient glow background */
        .glowing-orbs {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--primary);
            top: 20%;
            left: 15%;
        }

        .orb-2 {
            width: 350px;
            height: 350px;
            background: var(--secondary);
            bottom: 20%;
            right: 15%;
        }

        .register-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 100%;
            max-width: 460px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            z-index: 2;
            position: relative;
        }

        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-logo {
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-title);
            font-weight: 800;
            font-size: 1.8rem;
            color: white;
            box-shadow: 0 0 20px var(--primary-glow);
            margin-bottom: 0.75rem;
        }

        .brand-text {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 1.5rem;
        }

        .brand-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 1.15rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
        }

        .form-control {
            width: 100%;
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.85rem 1rem 0.85rem 2.75rem;
            color: var(--text-main);
            font-family: var(--font-family);
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .btn {
            width: 100%;
            padding: 0.9rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 4px 15px var(--primary-glow);
            margin-top: 0.5rem;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .card-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card-footer a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 500;
        }

        .card-footer a:hover {
            text-decoration: underline;
        }

        .toast {
            background-color: #ef4444;
            color: white;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="glowing-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="register-card">
        <div class="brand">
            <div class="brand-logo">P</div>
            <h2 class="brand-text">PicoTeam 회원가입</h2>
            <p class="brand-desc">신규 계정을 등록하여 관제 시스템을 이용하세요.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="toast" style="background-color: #ef4444;">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <div>{{ message }}</div>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/auth/register" method="POST">
            <div class="form-group">
                <label class="form-label">아이디</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="accountId" class="form-control" placeholder="아이디 입력" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">이름</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-signature"></i>
                    <input type="text" name="name" class="form-control" placeholder="성함 입력" required>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password" class="form-control" placeholder="비밀번호 설정" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">전화번호</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" name="phone" class="form-control" placeholder="전화번호 입력" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">
                회원가입 완료 <i class="fa-solid fa-user-plus"></i>
            </button>
        </form>

        <div class="card-footer">
            이미 계정이 있으신가요? <a href="/auth/login">로그인</a>
        </div>
    </div>

</body>
</html>
